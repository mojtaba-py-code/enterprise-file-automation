name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # A dependency does not have to change for it to become vulnerable. Monday
  # morning re-runs bandit and pip-audit against a fresh advisory database, so
  # a CVE published against an unchanged pin still gets noticed.
  schedule:
    - cron: "0 6 * * 1"

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        # The floor is a ratchet, not a target: coverage sits above 91%, and a
        # change that drags it under 85% has to be argued for rather than
        # merged unnoticed. It lives on this command line rather than in
        # pyproject's addopts on purpose — applied there it would also govern
        # `pytest -k something` locally, where a partial run covers a fraction
        # of the package by design and the gate would fail perfectly good work.
        # A floor only means anything against the whole suite, which is what
        # runs here.
        run: pytest -q --cov=file_automation --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Deliberately not `needs: test`. A base-image pull or a registry hiccup
    # must not be able to cancel the test job and hide a real failure.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The docker CLI is preinstalled on the runner, so this needs no action
      # to pin, no registry credentials, and the image never leaves the job.
      - name: Build the image
        run: docker build -t enterprise-file-automation:ci .

      # Proves the entrypoint resolves and the package imports inside the
      # image — the README's `docker build` recipe is otherwise unverified.
      - name: Entrypoint runs
        run: docker run --rm enterprise-file-automation:ci --help

      - name: Image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id enterprise-file-automation:ci -u)"
          echo "container uid: $uid"
          test "$uid" != "0"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          # setuptools is preinstalled on the runner and has had CVEs of its
          # own; pip-audit sees the whole environment, so upgrade it here
          # rather than let the runner's build tooling fail the audit.
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install bandit pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r src --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential that was committed and later removed is
          # still published, so scanning only the tip misses the worst case.
          fetch-depth: 0

      # A plain grep on purpose — no third-party action, nothing to pin,
      # nothing to hand a token to.
      - name: Look for credential-shaped strings in every commit
        run: |
          set -uo pipefail
          # Nothing is exempt from the scan, this workflow least of all: a CI
          # file is one of the likelier places for a token to be pasted while
          # someone is debugging a job, and an exempted file stays invisible
          # for the rest of the history. The exemption was never needed — no
          # alternative below can match the line that defines it, because
          # every literal prefix in it runs straight into a "[" that opens a
          # character class, and no class in the set accepts "[". Keep that
          # property when adding a pattern: end the literal part at a "[".
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,}|SECRET_ACCESS_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9/+]{20,}'
          # The revisions arrive on stdin instead of being spliced onto the
          # command line by $(git rev-list --all). That list grows by one SHA
          # per commit and has no upper bound, so a long-lived repository would
          # eventually push the command past the OS argument-length limit and
          # fail the job with an exec error — a scan that cannot run, wearing
          # the costume of a CI bug. xargs splits the revisions into as many
          # invocations as the limit requires, so history size cannot break it.
          #
          # The captured output decides, not the exit status: xargs answers 123
          # whenever any batch matched nothing, which is the ordinary case, so
          # its status cannot tell "clean" apart from "found something".
          hits="$(git rev-list --all | xargs -r git grep -InE -e "$pattern")" || true
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::a credential-shaped string is committed to this repository"
            echo "Rotate the credential first — deleting the line does not unpublish it."
            exit 1
          fi
          echo "No credential-shaped strings found in $(git rev-list --all --count) commits."
